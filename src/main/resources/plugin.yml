name: Ore Plugin
main: dev.dagxam.bedrockores.BedrockOresPlugin
version: ${project.version}
api-version: '1.21'
load: POSTWORLD
prefix: Ore Plugin
authors: [ "your-name" ]
description: Adds vanilla-compatible ore generation and rare rich ore veins with configurable rewards.
commands:
  bedrockores:
    description: Ore Plugin admin command
    permission: bedrockores.admin
permissions:
  bedrockores.admin:
    default: op
  bedrockores.use:
    default: true
