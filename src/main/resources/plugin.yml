name: BedrockOres
main: dev.dagxam.bedrockores.BedrockOresPlugin
version: ${project.version}
api-version: '1.21'
load: POSTWORLD
prefix: BedrockOres
authors: [ "dagxam" ]
description: Русские рудные узлы с добычей ударами, ограничением прочности и автоматическим возрождением.
commands:
  bedrockores:
    description: Административная команда управления рудными узлами
    usage: /bedrockores <help|reload|clearflags|regenloaded|restartgen>
    permission: bedrockores.admin
permissions:
  bedrockores.admin:
    description: Разрешает управление BedrockOres и выполнение административных команд
    default: op
  bedrockores.use:
    description: Разрешает добывать рудные узлы
    default: true
