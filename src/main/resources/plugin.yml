name: BedrockOres
main: dev.dagxam.bedrockores.BedrockOresPlugin
version: ${project.version}
api-version: '1.21'
load: POSTWORLD
prefix: BedrockOres
authors: [ "your-name" ]
description: Unbreakable ore nodes near bedrock that drop on hit and turn into bedrock after N hits.
commands:
  bedrockores:
    description: Bedrock Ores admin command
    permission: bedrockores.admin
permissions:
  bedrockores.admin:
    default: op
  bedrockores.use:
    default: true
