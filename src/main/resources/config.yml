# ============================================================
# BedrockOres — конфигурация рудных узлов
# ============================================================
# ВАЖНО ДЛЯ WATERWORLD:
# WaterWorld сам создаёт рельеф острова, океан и гору.
# BedrockOres НЕ использует собственную приблизительную геометрию
# острова. Он проверяет реальные блоки уже созданного мира.

разрешённые-мирами:
  - world
  - world_nether

# Интеграция с WaterWorld.
integrations:
  waterworld:
    включено: true
    # Имя основного мира WaterWorld. Если пусто — используется первый
    # разрешённый NORMAL-мир.
    имя-мира: world
    # WaterWorld генерирует terrain в ChunkGenerator, а гору достраивает
    # в ChunkPopulateEvent. Поэтому рудные узлы для NORMAL мира ставятся
    # только после полной загрузки/декорации чанка.
    ждать-полную-генерацию-чанка: true
    # Руды генерируются в реальный материал мира: STONE/DEEPSLATE/TUFF,
    # а также SAND/RED_SAND/GRAVEL. Вода и воздух всегда запрещены.
    учитывать-реальные-блоки: true

узел:
  ударов-минимум: 9
  ударов-максимум: 20

визуал:
  серверный-блок:
    включено: false
    соответствия:
      DEEPSLATE_DIAMOND_ORE: DIAMOND_BLOCK
      DEEPSLATE_EMERALD_ORE: EMERALD_BLOCK
      DEEPSLATE_REDSTONE_ORE: REDSTONE_BLOCK
      DEEPSLATE_LAPIS_ORE: LAPIS_BLOCK
      DEEPSLATE_GOLD_ORE: GOLD_BLOCK
      DEEPSLATE_IRON_ORE: IRON_BLOCK
      DEEPSLATE_COAL_ORE: COAL_BLOCK
      NETHERITE_SCRAP: ANCIENT_DEBRIS

generation:
  default-bedrock-band: 8

  # Эти множители больше не определяют геометрию острова.
  # Они только меняют плотность руды после анализа реального блока.
  layers:
    overworld:
      island: 1.00
      ocean: 0.90
      deep-ocean: 0.75

  # Внутренняя зона WaterWorld: основной остров + гора.
  waterworld:
    island:
      enabled: true
      density: 1.00
    mountain:
      enabled: true
      density: 1.15
    underwater-shelf:
      enabled: true
      density: 0.90
    ocean-floor:
      enabled: true
      density: 0.75
    deep-ocean:
      enabled: true
      density: 0.65

  # Профили руд. Диапазон Y расширен под WaterWorld: остров и гора
  # находятся выше моря, а подводный грунт — ниже уровня моря.
  ores:
    DEEPSLATE_COAL_ORE:
      enabled: true
      weight: 4
      vein-size-min: 3
      vein-size-max: 6
      min-y: -64
      max-y: 120
      density: 1.00
    DEEPSLATE_IRON_ORE:
      enabled: true
      weight: 6
      vein-size-min: 3
      vein-size-max: 7
      min-y: -64
      max-y: 120
      density: 1.00
    DEEPSLATE_COPPER_ORE:
      enabled: true
      weight: 4
      vein-size-min: 3
      vein-size-max: 7
      min-y: -64
      max-y: 96
      density: 1.00
    DEEPSLATE_GOLD_ORE:
      enabled: true
      weight: 3
      vein-size-min: 2
      vein-size-max: 5
      min-y: -64
      max-y: 64
      density: 0.85
    DEEPSLATE_REDSTONE_ORE:
      enabled: true
      weight: 8
      vein-size-min: 3
      vein-size-max: 7
      min-y: -64
      max-y: 32
      density: 1.10
    DEEPSLATE_LAPIS_ORE:
      enabled: true
      weight: 3
      vein-size-min: 2
      vein-size-max: 5
      min-y: -64
      max-y: 64
      density: 0.75
    DEEPSLATE_DIAMOND_ORE:
      enabled: true
      weight: 1
      vein-size-min: 2
      vein-size-max: 5
      min-y: -64
      max-y: 24
      density: 0.40
    DEEPSLATE_EMERALD_ORE:
      enabled: true
      weight: 1
      vein-size-min: 1
      vein-size-max: 3
      min-y: -16
      max-y: 120
      density: 0.20
    NETHERITE_SCRAP:
      enabled: true
      weight: 2
      vein-size-min: 1
      vein-size-max: 3
      min-y: 0
      max-y: 32
      density: 0.45

  cluster:
    size-min: 3
    size-max: 6
    min-spacing: 4
  chance-per-block: 0.008
  density-multiplier: 1.0
  target-per-chunk: 12
  max-per-chunk: 24
  fill-attempts-per-node: 25
  max-attempts-per-chunk: 1800

  overworld:
    allow-stone-variants: true
    allow-sand: true
    allow-red-sand: true
    allow-gravel: true
    allow-tuff: true

  queue:
    enabled: true
    chunks-per-tick: 2
    positions-per-tick: 300
    fill-attempts-per-tick: 180

fortune-enabled: true

ore-weights:
  DEEPSLATE_REDSTONE_ORE: 8
  DEEPSLATE_IRON_ORE: 6
  DEEPSLATE_GOLD_ORE: 3
  DEEPSLATE_COPPER_ORE: 4
  DEEPSLATE_COAL_ORE: 4
  DEEPSLATE_LAPIS_ORE: 3
  DEEPSLATE_DIAMOND_ORE: 1
  DEEPSLATE_EMERALD_ORE: 1

ore-weights-nether:
  NETHERITE_SCRAP: 2
  DEEPSLATE_GOLD_ORE: 1

respawn:
  enabled: true
  delay-seconds: 3600

persistence:
  save-interval-seconds: 120
  save-on-respawn-schedule: false

performance:
  direct-item-to-inventory: true
  xp-mode: direct
  hold-hit-interval-ticks: 5
  hold-timeout-ms: 400
  max-hold-hits-per-tick: 60
