# ============================================================
# BedrockOres — единая система генерации руд для WaterWorld
# ============================================================
# WaterWorld создаёт только рельеф. Все обычные руды и многоразовые
# рудные узлы генерирует этот плагин.

разрешённые-мирами:
  - world
  - world_nether

integrations:
  waterworld:
    включено: true
    имя-мира: world
    ждать-полную-генерацию-чанка: true
    учитывать-реальные-блоки: true

# Настройки многоразовых рудных узлов.
узел:
  ударов-минимум: 9
  ударов-максимум: 20

визуал:
  серверный-блок:
    включено: false
    соответствия:
      DEEPSLATE_DIAMOND_ORE: DIAMOND_BLOCK
      DEEPSLATE_EMERALD_ORE: EMERALD_BLOCK
      DEEPSLATE_REDSTONE_ORE: REDSTONE_BLOCK
      DEEPSLATE_LAPIS_ORE: LAPIS_BLOCK
      DEEPSLATE_GOLD_ORE: GOLD_BLOCK
      DEEPSLATE_IRON_ORE: IRON_BLOCK
      DEEPSLATE_COAL_ORE: COAL_BLOCK
      NETHERITE_SCRAP: ANCIENT_DEBRIS

generation:
  # ----------------------------------------------------------
  # Обычные ванильные руды.
  # Они НЕ сохраняются в SQLite и добываются обычным способом.
  # ----------------------------------------------------------
  vanilla-ores:
    enabled: true
    max-veins-per-chunk: 18
    max-attempts-per-chunk: 220
    ores:
      COAL_ORE:
        enabled: true
        weight: 18
        vein-size-min: 4
        vein-size-max: 12
        min-y: -32
        max-y: 150
        density: 0.72
      IRON_ORE:
        enabled: true
        weight: 16
        vein-size-min: 4
        vein-size-max: 10
        min-y: -64
        max-y: 180
        density: 0.62
      COPPER_ORE:
        enabled: true
        weight: 10
        vein-size-min: 4
        vein-size-max: 10
        min-y: -16
        max-y: 112
        density: 0.48
      GOLD_ORE:
        enabled: true
        weight: 7
        vein-size-min: 3
        vein-size-max: 8
        min-y: -64
        max-y: 64
        density: 0.34
      REDSTONE_ORE:
        enabled: true
        weight: 10
        vein-size-min: 3
        vein-size-max: 8
        min-y: -64
        max-y: 16
        density: 0.45
      LAPIS_ORE:
        enabled: true
        weight: 6
        vein-size-min: 3
        vein-size-max: 8
        min-y: -64
        max-y: 64
        density: 0.28
      DIAMOND_ORE:
        enabled: true
        weight: 3
        vein-size-min: 2
        vein-size-max: 7
        min-y: -64
        max-y: 16
        density: 0.18
      EMERALD_ORE:
        enabled: true
        weight: 2
        vein-size-min: 1
        vein-size-max: 3
        min-y: -16
        max-y: 220
        density: 0.12
      NETHER_QUARTZ_ORE:
        enabled: true
        weight: 18
        vein-size-min: 4
        vein-size-max: 12
        min-y: 10
        max-y: 118
        density: 0.75
      NETHER_GOLD_ORE:
        enabled: true
        weight: 10
        vein-size-min: 3
        vein-size-max: 8
        min-y: 10
        max-y: 118
        density: 0.50
      ANCIENT_DEBRIS:
        enabled: true
        weight: 1
        vein-size-min: 1
        vein-size-max: 3
        min-y: 8
        max-y: 22
        density: 0.08

  # ----------------------------------------------------------
  # Особые рудные узлы.
  # Сохраняются в SQLite, добываются многими ударами и возрождаются.
  # Плотность специально ниже обычных руд.
  # ----------------------------------------------------------
  special-nodes:
    enabled: true
    max-per-chunk: 8
    max-attempts-per-chunk: 900
    min-spacing: 6
    ores:
      DEEPSLATE_COAL_ORE:
        enabled: true
        weight: 7
        vein-size-min: 1
        vein-size-max: 3
        min-y: -64
        max-y: 96
        density: 0.45
      DEEPSLATE_IRON_ORE:
        enabled: true
        weight: 6
        vein-size-min: 1
        vein-size-max: 3
        min-y: -64
        max-y: 96
        density: 0.40
      DEEPSLATE_COPPER_ORE:
        enabled: true
        weight: 4
        vein-size-min: 1
        vein-size-max: 3
        min-y: -32
        max-y: 80
        density: 0.32
      DEEPSLATE_GOLD_ORE:
        enabled: true
        weight: 3
        vein-size-min: 1
        vein-size-max: 2
        min-y: -64
        max-y: 48
        density: 0.24
      DEEPSLATE_REDSTONE_ORE:
        enabled: true
        weight: 6
        vein-size-min: 1
        vein-size-max: 3
        min-y: -64
        max-y: 24
        density: 0.36
      DEEPSLATE_LAPIS_ORE:
        enabled: true
        weight: 3
        vein-size-min: 1
        vein-size-max: 2
        min-y: -64
        max-y: 48
        density: 0.20
      DEEPSLATE_DIAMOND_ORE:
        enabled: true
        weight: 1
        vein-size-min: 1
        vein-size-max: 2
        min-y: -64
        max-y: 16
        density: 0.08
      DEEPSLATE_EMERALD_ORE:
        enabled: true
        weight: 1
        vein-size-min: 1
        vein-size-max: 1
        min-y: -16
        max-y: 180
        density: 0.06
      NETHERITE_SCRAP:
        enabled: true
        weight: 1
        vein-size-min: 1
        vein-size-max: 1
        min-y: 8
        max-y: 22
        density: 0.05

  # Плотность особых узлов относительно фактического рельефа WaterWorld.
  waterworld:
    island:
      enabled: true
      density: 1.00
    mountain:
      enabled: true
      density: 1.15
    underwater-shelf:
      enabled: true
      density: 0.90
    ocean-floor:
      enabled: true
      density: 0.75
    deep-ocean:
      enabled: true
      density: 0.65

  queue:
    enabled: true
    chunks-per-tick: 2

fortune-enabled: true

respawn:
  enabled: true
  delay-seconds: 3600

persistence:
  save-interval-seconds: 120
  save-on-respawn-schedule: false

performance:
  direct-item-to-inventory: true
  xp-mode: direct
  hold-hit-interval-ticks: 5
  hold-timeout-ms: 400
  max-hold-hits-per-tick: 60
