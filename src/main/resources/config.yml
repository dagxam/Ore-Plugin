# ============================================================
# BedrockOres — конфигурация рудных узлов
# ============================================================
# Все основные параметры подписаны на русском.
# Названия материалов Minecraft (DEEPSLATE_DIAMOND_ORE и т.п.)
# оставлены в оригинальном виде, потому что это идентификаторы Bukkit.

# Миры, в которых разрешена генерация рудных узлов.
разрешённые-мирами:
  - world
  - world_nether

# Сколько ударов нужно для полного истощения рудного узла.
узел:
  ударов-минимум: 9
  ударов-максимум: 20

# ============================================================
# Внешний вид рудных узлов
# ============================================================
визуал:
  # Если включить, сервер физически заменяет руду на указанный блок.
  # Это влияет на внешний вид для всех игроков.
  серверный-блок:
    включено: false
    соответствия:
      DEEPSLATE_DIAMOND_ORE: DIAMOND_BLOCK
      DEEPSLATE_EMERALD_ORE: EMERALD_BLOCK
      DEEPSLATE_REDSTONE_ORE: REDSTONE_BLOCK
      DEEPSLATE_LAPIS_ORE: LAPIS_BLOCK
      DEEPSLATE_GOLD_ORE: GOLD_BLOCK
      DEEPSLATE_IRON_ORE: IRON_BLOCK
      DEEPSLATE_COAL_ORE: COAL_BLOCK
      # Виртуальная руда: NETHERITE_SCRAP.
      # Физически используется ANCIENT_DEBRIS.
      NETHERITE_SCRAP: ANCIENT_DEBRIS

# ============================================================
# Генерация
# ============================================================
генерация:
  # Сколько нижних блоков мира используется как базовая область,
  # если для профиля руды не задан собственный диапазон Y.
  нижних-слоёв-по-умолчанию: 8

  # Множители плотности для разных зон Overworld.
  # 1.0 = обычная плотность, 0.5 = в два раза меньше.
  слои:
    обычный-мир:
      включено: true
      остров: 1.00
      океан: 0.85
      глубокий-океан: 0.70
    ад:
      включено: true
      пещеры: 1.00

  # ==========================================================
  # Настройки каждой руды
  # ==========================================================
  # weight — относительная редкость среди выбранных руд.
  # размер-жилы — количество блоков в одной жиле.
  # минимальный-y / максимальный-y — допустимый диапазон высоты.
  # плотность — индивидуальный множитель частоты.
  руды:
    DEEPSLATE_COAL_ORE:
      включено: true
      вес: 4
      размер-жилы-минимум: 3
      размер-жилы-максимум: 6
      минимальный-y: -64
      максимальный-y: -48
      плотность: 1.00

    DEEPSLATE_IRON_ORE:
      включено: true
      вес: 6
      размер-жилы-минимум: 3
      размер-жилы-максимум: 6
      минимальный-y: -64
      максимальный-y: -48
      плотность: 1.00

    DEEPSLATE_COPPER_ORE:
      включено: true
      вес: 4
      размер-жилы-минимум: 3
      размер-жилы-максимум: 7
      минимальный-y: -64
      максимальный-y: -48
      плотность: 1.00

    DEEPSLATE_GOLD_ORE:
      включено: true
      вес: 3
      размер-жилы-минимум: 2
      размер-жилы-максимум: 5
      минимальный-y: -64
      максимальный-y: -48
      плотность: 0.85

    DEEPSLATE_REDSTONE_ORE:
      включено: true
      вес: 8
      размер-жилы-минимум: 3
      размер-жилы-максимум: 7
      минимальный-y: -64
      максимальный-y: -48
      плотность: 1.15

    DEEPSLATE_LAPIS_ORE:
      включено: true
      вес: 3
      размер-жилы-минимум: 2
      размер-жилы-максимум: 5
      минимальный-y: -64
      максимальный-y: -48
      плотность: 0.75

    DEEPSLATE_DIAMOND_ORE:
      включено: true
      вес: 1
      размер-жилы-минимум: 2
      размер-жилы-максимум: 4
      минимальный-y: -64
      максимальный-y: -48
      плотность: 0.35

    DEEPSLATE_EMERALD_ORE:
      включено: true
      вес: 1
      размер-жилы-минимум: 1
      размер-жилы-максимум: 3
      минимальный-y: -64
      максимальный-y: -48
      плотность: 0.20

    NETHERITE_SCRAP:
      включено: true
      вес: 2
      размер-жилы-минимум: 1
      размер-жилы-максимум: 3
      минимальный-y: 0
      максимальный-y: 32
      плотность: 0.45

  # ==========================================================
  # Общие ограничения генерации
  # ==========================================================
  # Используются как запасные значения, если у конкретной руды
  # отсутствует собственный параметр.
  жила:
    размер-минимум: 3
    размер-максимум: 6
    минимальная-дистанция: 4

  шанс-на-блок: 0.008
  общий-множитель-плотности: 1.0
  узлов-на-чанк: 12
  максимум-узлов-на-чанк: 24
  попыток-заполнения-на-узел: 25
  максимум-попыток-на-чанк: 1800

  обычный-мир:
    разрешить-варианты-камня: true

  # ==========================================================
  # Очередь генерации — защита TPS
  # ==========================================================
  очередь:
    включено: true
    чанков-за-тик: 2
    позиций-за-тик: 300
    попыток-заполнения-за-тик: 180

# ============================================================
# Fortune
# ============================================================
fortune:
  включено: true

# Старые названия весов сохраняются для совместимости со старыми
# версиями сохранений и конфигураций.
веса-руд:
  DEEPSLATE_REDSTONE_ORE: 8
  DEEPSLATE_IRON_ORE: 6
  DEEPSLATE_GOLD_ORE: 3
  DEEPSLATE_COPPER_ORE: 4
  DEEPSLATE_COAL_ORE: 4
  DEEPSLATE_LAPIS_ORE: 3
  DEEPSLATE_DIAMOND_ORE: 1
  DEEPSLATE_EMERALD_ORE: 1

веса-руд-ада:
  NETHERITE_SCRAP: 2
  DEEPSLATE_GOLD_ORE: 1

# ============================================================
# Возрождение рудных узлов
# ============================================================
возрождение:
  включено: true
  задержка-секунд: 3600

# ============================================================
# Сохранение данных
# ============================================================
сохранение:
  интервал-секунд: 120
  сохранять-при-постановке-возрождения: false

# ============================================================
# Производительность и добыча
# ============================================================
производительность:
  выдавать-предмет-сразу-в-инвентарь: true
  режим-опыта: direct
  интервал-ударов-тиков: 5
  таймаут-удержания-мс: 400
  максимум-ударов-за-тик: 60
