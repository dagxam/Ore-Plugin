enabled-worlds:
  - world

generation:
  # Вертикальный диапазон можно не задавать — тогда весь мир.
  # Если нужно ограничить, добавь числа:
  # y-min: -64
  # y-max: 320

  # Плотность
  chance-per-block: 0.008
  density-multiplier: 1.0

  visual:
  mode: particles
  particles:
    type: END_ROD
    count: 1
    offset: 0.12
    extra: 0.0
    per-node-chance: 0.12
    period-ticks: 20
    radius-chunks: 2
    max-nodes-per-tick: 150

    visual:
  mode: overlay         # overlay | particles | none
  overlay:
    material: LIGHT_BLUE_STAINED_GLASS
    scale: 1.02         # 1.00–1.04 (чуть больше блока, чтобы не мерцал)
    glow: true
    team-color: AQUA    # цвет свечения (цвет команды скорборда)
    brightness: 15      # 0..15 (если API доступно)

    enabled-worlds:
  - world

visual:
  mode: none
  server-solid:
    enabled: true
    map:
      DEEPSLATE_DIAMOND_ORE: DIAMOND_BLOCK
      DEEPSLATE_EMERALD_ORE: EMERALD_BLOCK
      DEEPSLATE_REDSTONE_ORE: REDSTONE_BLOCK   # если не нужен сигнал, замени на RED_NETHER_BRICKS/NETHER_WART_BLOCK и т.п.
      DEEPSLATE_LAPIS_ORE: LAPIS_BLOCK
      DEEPSLATE_GOLD_ORE: GOLD_BLOCK
      DEEPSLATE_IRON_ORE: IRON_BLOCK
      DEEPSLATE_COAL_ORE: COAL_BLOCK
      DEEPSLATE_COPPER_ORE: COPPER_BLOCK
      DEEPSLATE_COPPER_ORE: COPPER_BLOCK
    
  # Кластеры (1–3 блока), минимальная дистанция между кластерами (по X/Z)
  cluster:
    size-min: 1
    size-max: 3
    min-spacing: 5

  # Цели по КЛАСТЕРАМ на чанк
  target-per-chunk: 12
  max-per-chunk: 24
  fill-attempts-per-node: 25

  # Очередь «ленивой» генерации
  queue:
    enabled: true
    chunks-per-tick: 2
    positions-per-tick: 280
    fill-attempts-per-tick: 150

fortune-enabled: true

ore-weights:
  DEEPSLATE_REDSTONE_ORE: 8
  DEEPSLATE_IRON_ORE: 6
  DEEPSLATE_GOLD_ORE: 3
  DEEPSLATE_COPPER_ORE: 4
  DEEPSLATE_COAL_ORE: 4
  DEEPSLATE_LAPIS_ORE: 3
  DEEPSLATE_DIAMOND_ORE: 1
  DEEPSLATE_EMERALD_ORE: 1

respawn:
  enabled: true
  delay-seconds: 3600

performance:
  direct-item-to-inventory: true
  xp-mode: direct
  hold-hit-interval-ticks: 5
  hold-timeout-ms: 400
  max-hold-hits-per-tick: 60
  
