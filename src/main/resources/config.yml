enabled-worlds:
  - world

generation:
  # Сколько нижних слоёв участвуют (от minY вверх)
  layers-from-bottom: 7

  # Плотность генерации
  chance-per-block: 0.008
  density-multiplier: 1.0

  # Минимальная дистанция между узлами (в блоках)
  min-spacing: 4

  # Целевое/максимальное число узлов на чанк и «добор» попытками
  target-per-chunk: 12
  max-per-chunk: 24
  fill-attempts-per-node: 25

  # Диапазон "ударов" до исчерпания
  min-hits: 15
  max-hits: 25

  # Очередь «ленивой» генерации — чтобы не вешать тики на загрузке чанков
  queue:
    enabled: true
    chunks-per-tick: 2
    positions-per-tick: 280
    fill-attempts-per-tick: 150

fortune-enabled: true

# Веса руд
ore-weights:
  DEEPSLATE_REDSTONE_ORE: 8
  DEEPSLATE_IRON_ORE: 6
  DEEPSLATE_GOLD_ORE: 3
  DEEPSLATE_COPPER_ORE: 4
  DEEPSLATE_COAL_ORE: 4
  DEEPSLATE_LAPIS_ORE: 3
  DEEPSLATE_DIAMOND_ORE: 1
  DEEPSLATE_EMERALD_ORE: 1

respawn:
  enabled: true
  delay-seconds: 3600  # 1 час

performance:
  # Дроп сразу в инвентарь (остаток — на землю)
  direct-item-to-inventory: true
  # Опыт напрямую игроку (без орбов) или орбами
  xp-mode: direct         # direct | orb

  # Удары при удержании ЛКМ
  hold-hit-interval-ticks: 5
  hold-timeout-ms: 400
  max-hold-hits-per-tick: 60
  
