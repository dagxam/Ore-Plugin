    drops-max: 1
    hits-min: 10
    hits-max: 20
    vein-size-min: 5
    vein-size-max: 10

visual:
  server-solid:
    enabled: false
    map: {}

# Автоматический респаун выключен: после истощения блок становится BEDROCK.
respawn:
  enabled: false
  delay-seconds: 3600

persistence:
  save-interval-seconds: 120
  save-on-respawn-schedule: false

performance:
  direct-item-to-inventory: true
  xp-mode: direct
  hold-hit-interval-ticks: 5
  hold-timeout-ms: 400
  max-hold-hits-per-tick: 60
