# Ore Plugin — только плотные (богатые) руды.
# Стандартные руды Minecraft и/или другого плагина НЕ изменяются.
# Пустой список = все миры сервера.
enabled-worlds: []

node:
  # Внутреннее количество ударов до разрушения плотного блока.
  hits-min: 1
  hits-max: 1

drops:
  # За каждый добытый плотный рудный блок игрок получает 5–20 единиц руды.
  min-per-node: 5
  max-per-node: 20
  respect-silk-touch: false

# Плотные рудные жилы.
# Каждая жила состоит из 3–5 связанных блоков одной руды.
generation:
  enabled: true
  veins-per-chunk: 2
  vein-size-min: 3
  vein-size-max: 5

  # Плотные руды могут появляться на любой высоте мира.
  y-min: null
  y-max: null

  # Минимальное горизонтальное расстояние между центрами жил.
  min-spacing: 8
  vertical-spacing: 4
  max-attempts-per-chunk: 96

  # Плавная очередь генерации без большого burst по TPS.
  queue:
    enabled: true
    chunks-per-tick: 2

# Вероятности выбора типа ПЛОТНОЙ руды.
# Удали/поставь 0 — руда не будет генерироваться.
ore-weights:
  REDSTONE_ORE: 8
  IRON_ORE: 6
  GOLD_ORE: 3
  COPPER_ORE: 4
  COAL_ORE: 4
  LAPIS_ORE: 3
  DIAMOND_ORE: 1
  EMERALD_ORE: 1

# Плотные руды Нижнего мира.
ore-weights-nether:
  NETHER_GOLD_ORE: 6
  NETHER_QUARTZ_ORE: 8
  ANCIENT_DEBRIS: 2

# В End по умолчанию плотные руды не генерируются.
ore-weights-end: {}

visual:
  server-solid:
    enabled: false
    map: {}

respawn:
  enabled: true
  delay-seconds: 3600

persistence:
  save-interval-seconds: 120
  save-on-respawn-schedule: false

performance:
  direct-item-to-inventory: true
  xp-mode: direct
  hold-hit-interval-ticks: 5
  hold-timeout-ms: 400
  max-hold-hits-per-tick: 60
