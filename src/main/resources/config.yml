enabled-worlds:
  - world
  - world_nether

visual:
  mode: none                 # overlay/particles/fakeblock не используем
  server-solid:
    enabled: true            # показывать узлы как «цельные» блоки на сервере
    map:                     # соответствие: исходная руда -> какой блок ставить
      DEEPSLATE_DIAMOND_ORE: DIAMOND_BLOCK
      DEEPSLATE_EMERALD_ORE: EMERALD_BLOCK
      DEEPSLATE_REDSTONE_ORE: REDSTONE_BLOCK     # если не нужен сигнал — замените, напр., на RED_NETHER_BRICKS
      DEEPSLATE_LAPIS_ORE:   LAPIS_BLOCK
      DEEPSLATE_GOLD_ORE:    GOLD_BLOCK
      DEEPSLATE_IRON_ORE:    IRON_BLOCK
      DEEPSLATE_COAL_ORE:    COAL_BLOCK

# ──────────────────────────────────────────────────────────────────────────────
# Генерация узлов: увеличенный размер кластера (кол-во блоков рядом)
generation:
  # другие параметры генерации можно оставить пустыми — плагин возьмёт дефолты
  cluster:
    size-min: 10            # было меньше — теперь минимум 10
    size-max: 20            # верхняя граница 20
  # при необходимости можно добавить:
  # y-min: -64
  # y-max: 320
  # chance-per-block: 0.008
  # density-multiplier: 1.0
  # target-per-chunk: 12
  # max-per-chunk: 24
  # fill-attempts-per-node: 25
  queue:
    enabled: true
    chunks-per-tick: 2
    positions-per-tick: 300          # зарезервировано (если логика не задействована)
    fill-attempts-per-tick: 180      # зарезервировано

fortune-enabled: true           # учитывать Fortune (упрощённая модель)

# Частота типов руд (чем больше вес — тем чаще)
ore-weights:
  DEEPSLATE_REDSTONE_ORE: 8
  DEEPSLATE_IRON_ORE: 6
  DEEPSLATE_GOLD_ORE: 3
  DEEPSLATE_COPPER_ORE: 4
  DEEPSLATE_COAL_ORE: 4
  DEEPSLATE_LAPIS_ORE: 3
  DEEPSLATE_DIAMOND_ORE: 1
  DEEPSLATE_EMERALD_ORE: 1
  ANCIENT_DEBRIS: 1

# Можно задать отдельные веса по мирам:
# ore-weights-overworld:
#   DEEPSLATE_REDSTONE_ORE: 8
#   ...
# ore-weights-nether:
#   ANCIENT_DEBRIS: 2
#   DEEPSLATE_GOLD_ORE: 1

respawn:
  enabled: true
  delay-seconds: 3600           # через сколько секунд узел возродится

performance:
  direct-item-to-inventory: true
  xp-mode: direct               # direct = сразу игроку; orb = орбами
  hold-hit-interval-ticks: 5    # если вернёте «удары при удержании» — скорость
  hold-timeout-ms: 400
  max-hold-hits-per-tick: 60
