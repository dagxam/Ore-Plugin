# Ore Plugin — только плотные (богатые) руды.
# Стандартные руды Minecraft и/или другого плагина НЕ изменяются.
enabled-worlds: []

node:
  hits-min: 1
  hits-max: 1

drops:
  # Общий запасной вариант. Каждая руда ниже может переопределить его.
  min-per-node: 5
  max-per-node: 20
  respect-silk-touch: false

generation:
  enabled: true
  # Запасное значение. Для каждой руды можно задать своё количество блоков в жиле.
  veins-per-chunk: 2
  vein-size-min: 3
  vein-size-max: 5
  # Пусто/не задано = вся высота мира.
  y-min: null
  y-max: null
  min-spacing: 8
  vertical-spacing: 4
  max-attempts-per-chunk: 96
  queue:
    enabled: true
    chunks-per-tick: 2

# Вес выбора богатой руды. Чем выше weight, тем чаще жила этого типа.
ore-weights:
  REDSTONE_ORE: 8
  IRON_ORE: 6
  GOLD_ORE: 3
  COPPER_ORE: 4
  COAL_ORE: 4
  LAPIS_ORE: 3
  DIAMOND_ORE: 1
  EMERALD_ORE: 1

ore-weights-nether:
  NETHER_GOLD_ORE: 6
  NETHER_QUARTZ_ORE: 8
  ANCIENT_DEBRIS: 2

ore-weights-end: {}

# ============================================================
# ИНДИВИДУАЛЬНЫЕ НАСТРОЙКИ КАЖДОЙ БОГАТОЙ РУДЫ
# drops-min / drops-max = сколько ресурса выпадает с ОДНОГО блока.
# vein-size-min / vein-size-max = сколько БЛОКОВ этой руды будет рядом в жиле.
# Если параметр не задан — используется общий параметр выше.
# ============================================================
rich-ores:
  COAL_ORE:
    drops-min: 5
    drops-max: 20
    vein-size-min: 3
    vein-size-max: 5
  IRON_ORE:
    drops-min: 5
    drops-max: 20
    vein-size-min: 3
    vein-size-max: 5
  COPPER_ORE:
    drops-min: 5
    drops-max: 20
    vein-size-min: 3
    vein-size-max: 5
  GOLD_ORE:
    drops-min: 5
    drops-max: 20
    vein-size-min: 3
    vein-size-max: 5
  REDSTONE_ORE:
    drops-min: 5
    drops-max: 20
    vein-size-min: 3
    vein-size-max: 5
  LAPIS_ORE:
    drops-min: 5
    drops-max: 20
    vein-size-min: 3
    vein-size-max: 5
  DIAMOND_ORE:
    drops-min: 5
    drops-max: 20
    vein-size-min: 3
    vein-size-max: 5
  EMERALD_ORE:
    drops-min: 5
    drops-max: 20
    vein-size-min: 3
    vein-size-max: 5
  NETHER_GOLD_ORE:
    drops-min: 5
    drops-max: 20
    vein-size-min: 3
    vein-size-max: 5
  NETHER_QUARTZ_ORE:
    drops-min: 5
    drops-max: 20
    vein-size-min: 3
    vein-size-max: 5
  ANCIENT_DEBRIS:
    drops-min: 5
    drops-max: 20
    vein-size-min: 3
    vein-size-max: 5

visual:
  server-solid:
    enabled: false
    map: {}

respawn:
  enabled: true
  delay-seconds: 3600

persistence:
  save-interval-seconds: 120
  save-on-respawn-schedule: false

performance:
  direct-item-to-inventory: true
  xp-mode: direct
  hold-hit-interval-ticks: 5
  hold-timeout-ms: 400
  max-hold-hits-per-tick: 60
