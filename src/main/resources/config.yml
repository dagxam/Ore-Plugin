enabled-worlds:
  - world
  - world_nether

node:
  hits-min: 9
  hits-max: 20

visual:
  server-solid:
    enabled: false
    map:
      DEEPSLATE_DIAMOND_ORE: DIAMOND_BLOCK
      DEEPSLATE_EMERALD_ORE: EMERALD_BLOCK
      DEEPSLATE_REDSTONE_ORE: REDSTONE_BLOCK
      DEEPSLATE_LAPIS_ORE: LAPIS_BLOCK
      DEEPSLATE_GOLD_ORE: GOLD_BLOCK
      DEEPSLATE_IRON_ORE: IRON_BLOCK
      DEEPSLATE_COAL_ORE: COAL_BLOCK
      NETHERITE_SCRAP: ANCIENT_DEBRIS

# Generation is deliberately split into world layers and ore profiles.
# Existing generation.* values remain supported for backward compatibility.
generation:
  default-bedrock-band: 8

  layers:
    overworld:
      enabled: true
      # Logical layer used for density tuning. Values are multipliers.
      island: 1.00
      ocean: 0.85
      deep-ocean: 0.70
    nether:
      enabled: true
      cavern: 1.00

  ores:
    DEEPSLATE_COAL_ORE:
      enabled: true
      weight: 4
      vein-size-min: 3
      vein-size-max: 6
      min-y: -64
      max-y: -48
      density: 1.00
    DEEPSLATE_IRON_ORE:
      enabled: true
      weight: 6
      vein-size-min: 3
      vein-size-max: 6
      min-y: -64
      max-y: -48
      density: 1.00
    DEEPSLATE_COPPER_ORE:
      enabled: true
      weight: 4
      vein-size-min: 3
      vein-size-max: 7
      min-y: -64
      max-y: -48
      density: 1.00
    DEEPSLATE_GOLD_ORE:
      enabled: true
      weight: 3
      vein-size-min: 2
      vein-size-max: 5
      min-y: -64
      max-y: -48
      density: 0.85
    DEEPSLATE_REDSTONE_ORE:
      enabled: true
      weight: 8
      vein-size-min: 3
      vein-size-max: 7
      min-y: -64
      max-y: -48
      density: 1.15
    DEEPSLATE_LAPIS_ORE:
      enabled: true
      weight: 3
      vein-size-min: 2
      vein-size-max: 5
      min-y: -64
      max-y: -48
      density: 0.75
    DEEPSLATE_DIAMOND_ORE:
      enabled: true
      weight: 1
      vein-size-min: 2
      vein-size-max: 4
      min-y: -64
      max-y: -48
      density: 0.35
    DEEPSLATE_EMERALD_ORE:
      enabled: true
      weight: 1
      vein-size-min: 1
      vein-size-max: 3
      min-y: -64
      max-y: -48
      density: 0.20
    NETHERITE_SCRAP:
      enabled: true
      weight: 2
      vein-size-min: 1
      vein-size-max: 3
      min-y: 0
      max-y: 32
      density: 0.45

  # Legacy-compatible global fallback values.
  cluster:
    size-min: 3
    size-max: 6
    min-spacing: 4
  chance-per-block: 0.008
  density-multiplier: 1.0
  target-per-chunk: 12
  max-per-chunk: 24
  fill-attempts-per-node: 25
  max-attempts-per-chunk: 1800

  overworld:
    allow-stone-variants: true

  queue:
    enabled: true
    chunks-per-tick: 2
    positions-per-tick: 300
    fill-attempts-per-tick: 180

fortune-enabled: true

# Legacy weights remain available for existing installations.
ore-weights:
  DEEPSLATE_REDSTONE_ORE: 8
  DEEPSLATE_IRON_ORE: 6
  DEEPSLATE_GOLD_ORE: 3
  DEEPSLATE_COPPER_ORE: 4
  DEEPSLATE_COAL_ORE: 4
  DEEPSLATE_LAPIS_ORE: 3
  DEEPSLATE_DIAMOND_ORE: 1
  DEEPSLATE_EMERALD_ORE: 1

ore-weights-nether:
  NETHERITE_SCRAP: 2
  DEEPSLATE_GOLD_ORE: 1

respawn:
  enabled: true
  delay-seconds: 3600

persistence:
  save-interval-seconds: 120
  save-on-respawn-schedule: false

performance:
  direct-item-to-inventory: true
  xp-mode: direct
  hold-hit-interval-ticks: 5
  hold-timeout-ms: 400
  max-hold-hits-per-tick: 60
