enabled-worlds:
  - world
  - world_nether

visual:
  mode: none
  server-solid:
    enabled: true
    map:
      DEEPSLATE_DIAMOND_ORE: DIAMOND_BLOCK
      DEEPSLATE_EMERALD_ORE: EMERALD_BLOCK
      DEEPSLATE_REDSTONE_ORE: REDSTONE_BLOCK
      DEEPSLATE_LAPIS_ORE:   LAPIS_BLOCK
      DEEPSLATE_GOLD_ORE:    GOLD_BLOCK
      DEEPSLATE_IRON_ORE:    IRON_BLOCK
      DEEPSLATE_COAL_ORE:    COAL_BLOCK
      DEEPSLATE_COPPER_ORE:  COPPER_BLOCK
      ANCIENT_DEBRIS:        NETHERITE_BLOCK

generation:
  # Если нужно — задайте диапазон высот:
  # y-min: -64
  # y-max: 320

  chance-per-block: 0.012
  density-multiplier: 1.3

  cluster:
    size-min: 1
    size-max: 3
    min-spacing: 5

  target-per-chunk: 18
  max-per-chunk: 30
  fill-attempts-per-node: 25

  min-hits: 25
  max-hits: 100

  queue:
    enabled: true
    chunks-per-tick: 2
    positions-per-tick: 300
    fill-attempts-per-tick: 180

fortune-enabled: true

# Общие веса (если хотите — можно разнести по мирам ниже)
ore-weights:
  DEEPSLATE_REDSTONE_ORE: 8
  DEEPSLATE_IRON_ORE: 6
  DEEPSLATE_GOLD_ORE: 3
  DEEPSLATE_COPPER_ORE: 4
  DEEPSLATE_COAL_ORE: 4
  DEEPSLATE_LAPIS_ORE: 3
  DEEPSLATE_DIAMOND_ORE: 1
  DEEPSLATE_EMERALD_ORE: 1
  ANCIENT_DEBRIS: 1

# (опционально) Разные веса по мирам:
# ore-weights-overworld:
#   DEEPSLATE_REDSTONE_ORE: 8
#   DEEPSLATE_IRON_ORE: 6
#   DEEPSLATE_GOLD_ORE: 3
#   DEEPSLATE_COPPER_ORE: 4
#   DEEPSLATE_COAL_ORE: 4
#   DEEPSLATE_LAPIS_ORE: 3
#   DEEPSLATE_DIAMOND_ORE: 1
#   DEEPSLATE_EMERALD_ORE: 1
# ore-weights-nether:
#   ANCIENT_DEBRIS: 2
#   DEEPSLATE_GOLD_ORE: 1   # если хотите «золотые» узлы и в аду

respawn:
  enabled: true
  delay-seconds: 3600

performance:
  direct-item-to-inventory: true
  xp-mode: direct
  hold-hit-interval-ticks: 5
  hold-timeout-ms: 400
  max-hold-hits-per-tick: 60
