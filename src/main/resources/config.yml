# В каких мирах работает плагин
enabled-worlds:
  - world
  - world_nether

# Настройки узла (удары до истощения)
node:
  hits-min: 9
  hits-max: 20

visual:
  # none | server-solid (если поддерживается)
  mode: none

  server-solid:
    enabled: false

    # чем отображать физический блок узла на сервере
    # ключ = "логическая руда/дроп", значение = блок, который ставим в мир
    map:
      DEEPSLATE_DIAMOND_ORE: DIAMOND_BLOCK
      DEEPSLATE_EMERALD_ORE: EMERALD_BLOCK
      DEEPSLATE_REDSTONE_ORE: REDSTONE_BLOCK
      DEEPSLATE_LAPIS_ORE:   LAPIS_BLOCK
      DEEPSLATE_GOLD_ORE:    GOLD_BLOCK
      DEEPSLATE_IRON_ORE:    IRON_BLOCK
      DEEPSLATE_COAL_ORE:    COAL_BLOCK

      # Виртуальная "руда": NETHERITE_SCRAP
      # Физически узел ставит ANCIENT_DEBRIS, но дроп будет NETHERITE_SCRAP
      NETHERITE_SCRAP: ANCIENT_DEBRIS

generation:
  # Если y-min/y-max не заданы — берётся узкая полоса "near bedrock"
  # y-min: -64
  # y-max: -56

  # ширина зоны от нижней границы мира (near bedrock band)
  default-bedrock-band: 8

  cluster:
    size-min: 3
    size-max: 6
    min-spacing: 4

  chance-per-block: 0.008
  density-multiplier: 1.0
  target-per-chunk: 12
  max-per-chunk: 24
  fill-attempts-per-node: 25
  max-attempts-per-chunk: 1800

  overworld:
    allow-stone-variants: true

  queue:
    enabled: true
    chunks-per-tick: 2
    positions-per-tick: 300
    fill-attempts-per-tick: 180

fortune-enabled: true

# Общие веса (Overworld)
ore-weights:
  DEEPSLATE_REDSTONE_ORE: 8
  DEEPSLATE_IRON_ORE: 6
  DEEPSLATE_GOLD_ORE: 3
  DEEPSLATE_COPPER_ORE: 4
  DEEPSLATE_COAL_ORE: 4
  DEEPSLATE_LAPIS_ORE: 3
  DEEPSLATE_DIAMOND_ORE: 1
  DEEPSLATE_EMERALD_ORE: 1

# Nether веса (добавили NETHERITE_SCRAP)
ore-weights-nether:
  NETHERITE_SCRAP: 2
  DEEPSLATE_GOLD_ORE: 1

respawn:
  enabled: true

  # фиксированная задержка респавна (как у тебя было)
  delay-seconds: 3600

  # (опционально) если в коде поддерживаются min/max
  # min-seconds: 300
  # max-seconds: 900

# Если хочешь сохранять nodes.yml сразу при scheduleRespawn (может лагать при активной добыче)
persistence:
  save-on-respawn-schedule: false

performance:
  direct-item-to-inventory: true
  xp-mode: direct
  hold-hit-interval-ticks: 5
  hold-timeout-ms: 400
  max-hold-hits-per-tick: 60
