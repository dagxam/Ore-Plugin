# Ore Plugin — только плотные (богатые) руды.
# Стандартные руды Minecraft и/или другого плагина НЕ изменяются.
enabled-worlds: []

node:
  # Количество ударов по одному богатому рудному блоку.
  hits-min: 10
  hits-max: 20

drops:
  # Один удар = одна руда.
  min-per-node: 1
  max-per-node: 1
  respect-silk-touch: false

generation:
  enabled: true
  # Сколько богатых жил пытаемся создать в каждом чанке.
  veins-per-chunk: 2
  # Запасные значения. Для каждой руды можно задать свои.
  vein-size-min: 5
  vein-size-max: 10
  # Богатые руды генерируются только в первых 5 блоках над бедроком.
  bedrock-layer-height: 5
  y-min: null
  y-max: null
  min-spacing: 8
  vertical-spacing: 4
  max-attempts-per-chunk: 256
  queue:
    enabled: true
    chunks-per-tick: 2
  # После полного истощения жилы при следующей загрузке чанка создаётся новая жила.
  # Истощённый блок остаётся BEDROCK.
  depleted-block: BEDROCK

ore-weights:
  REDSTONE_ORE: 8
  IRON_ORE: 6
  GOLD_ORE: 3
  COPPER_ORE: 4
  COAL_ORE: 4
  LAPIS_ORE: 3
  DIAMOND_ORE: 1
  EMERALD_ORE: 1

ore-weights-nether:
  NETHER_GOLD_ORE: 6
  NETHER_QUARTZ_ORE: 8
  ANCIENT_DEBRIS: 2

ore-weights-end: {}

# ============================================================
# ИНДИВИДУАЛЬНЫЕ НАСТРОЙКИ КАЖДОЙ БОГАТОЙ РУДЫ
# drops-min / drops-max = сколько ресурса выпадает за ОДИН УДАР.
# hits-min / hits-max = сколько ударов выдерживает ОДИН блок.
# vein-size-min / vein-size-max = сколько БЛОКОВ руды в одной жиле.
# ============================================================
rich-ores:
  COAL_ORE:
    drops-min: 1
    drops-max: 1
    hits-min: 10
    hits-max: 20
    vein-size-min: 5
    vein-size-max: 10
  IRON_ORE:
    drops-min: 1
    drops-max: 1
    hits-min: 10
    hits-max: 20
    vein-size-min: 5
    vein-size-max: 10
  COPPER_ORE:
    drops-min: 1
    drops-max: 1
    hits-min: 10
    hits-max: 20
    vein-size-min: 5
    vein-size-max: 10
  GOLD_ORE:
    drops-min: 1
    drops-max: 1
    hits-min: 10
    hits-max: 20
    vein-size-min: 5
    vein-size-max: 10
  REDSTONE_ORE:
    drops-min: 1
    drops-max: 1
    hits-min: 10
    hits-max: 20
    vein-size-min: 5
    vein-size-max: 10
  LAPIS_ORE:
    drops-min: 1
    drops-max: 1
    hits-min: 10
    hits-max: 20
    vein-size-min: 5
    vein-size-max: 10
  DIAMOND_ORE:
    drops-min: 1
    drops-max: 1
    hits-min: 10
    hits-max: 20
    vein-size-min: 5
    vein-size-max: 10
  EMERALD_ORE:
    drops-min: 1
    drops-max: 1
    hits-min: 10
    hits-max: 20
    vein-size-min: 5
    vein-size-max: 10
  NETHER_GOLD_ORE:
    drops-min: 1
    drops-max: 1
    hits-min: 10
    hits-max: 20
    vein-size-min: 5
    vein-size-max: 10
  NETHER_QUARTZ_ORE:
    drops-min: 1
    drops-max: 1
    hits-min: 10
    hits-max: 20
    vein-size-min: 5
    vein-size-max: 10
  ANCIENT_DEBRIS:
