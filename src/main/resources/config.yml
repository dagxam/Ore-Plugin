# Пустой список = все миры сервера, включая обычный мир, Незер и Энд.
enabled-worlds: []

# Каждый специальный блок разрушается с первого успешного удара.
node:
  hits-min: 1
  hits-max: 1

# Награда за один специальный блок: случайно от 5 до 20 единиц соответствующей руды.
drops:
  min-per-node: 5
  max-per-node: 20
  respect-silk-touch: false

visual:
  server-solid:
    enabled: false
    map: {}

generation:
  # Генерация идёт по всей естественной высоте мира, а не только у бедрока.
  y-min: null
  y-max: null
  nodes-per-chunk: 2
  max-attempts-per-chunk: 96
  min-spacing: 8
  vertical-spacing: 4
  replace-standard-ores: false
  overworld:
    allow-stone-variants: true
  queue:
    enabled: true
    chunks-per-tick: 2
    positions-per-tick: 128

ore-weights:
  DEEPSLATE_REDSTONE_ORE: 8
  DEEPSLATE_IRON_ORE: 6
  DEEPSLATE_GOLD_ORE: 3
  DEEPSLATE_COPPER_ORE: 4
  DEEPSLATE_COAL_ORE: 4
  DEEPSLATE_LAPIS_ORE: 3
  DEEPSLATE_DIAMOND_ORE: 1
  DEEPSLATE_EMERALD_ORE: 1

ore-weights-nether:
  ANCIENT_DEBRIS: 2

ore-weights-end:
  DEEPSLATE_DIAMOND_ORE: 2
  DEEPSLATE_EMERALD_ORE: 1

respawn:
  enabled: true
  delay-seconds: 3600

persistence:
  save-interval-seconds: 120
  save-on-respawn-schedule: false

performance:
  direct-item-to-inventory: true
  xp-mode: direct
